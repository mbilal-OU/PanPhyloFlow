name: Nextflow stub test

on:
  push:
  pull_request:

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
      - name: Run Panaroo branch in stub mode
        run: |
          nextflow run main.nf -stub-run -profile ci \
            --input tests/data/stub_samples.csv \
            --input_type fasta \
            --pangenome panaroo \
            --outdir stub_results_panaroo
          test -f stub_results_panaroo/05_report/index.html
      - name: Run Roary branch in stub mode
        run: |
          nextflow run main.nf -stub-run -profile ci \
            --input tests/data/stub_samples.csv \
            --input_type fasta \
            --pangenome roary \
            --outdir stub_results_roary
          test -f stub_results_roary/05_report/index.html
