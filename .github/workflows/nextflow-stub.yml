name: Nextflow stub test

on:
  push:
  pull_request:

jobs:
  stub:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          # Pin to the documented minimum supported version: the strongest
          # compatibility check is that the workflow runs on the oldest
          # Nextflow it claims to support (see nextflow.config manifest).
          version: '24.10.0'
      - name: Run Panaroo branch in stub mode
        run: |
          nextflow run main.nf -stub-run -profile ci \
            --input tests/data/stub_samples.csv \
            --input_type fasta \
            --pangenome panaroo \
            --outdir stub_results_panaroo
          ./tests/assert_stub_results.sh stub_results_panaroo
      - name: Run Roary branch in stub mode
        run: |
          nextflow run main.nf -stub-run -profile ci \
            --input tests/data/stub_samples.csv \
            --input_type fasta \
            --pangenome roary \
            --outdir stub_results_roary
          ./tests/assert_stub_results.sh stub_results_roary
      - name: Run GFF-input branch in stub mode
        run: |
          nextflow run main.nf -stub-run -profile ci \
            --input tests/data/stub_samples_gff.csv \
            --input_type gff \
            --pangenome roary \
            --outdir stub_results_gff
          ./tests/assert_stub_results.sh stub_results_gff
          # GFF inputs must be staged into 01_annotation like Prokka outputs are
          test -f stub_results_gff/01_annotation/Genome_A.gff
          test -f stub_results_gff/01_annotation/Genome_B.gff
