<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Animated PanPhyloFlow workflow</title>
  <desc id="desc">Animated Roary-first microbial pangenomics and phylogenomics workflow showing genomes moving through annotation, pangenome construction, summary, core alignment, phylogeny and reporting, with Panaroo as an optional alternative.</desc>
  <defs>
    <linearGradient id="flowGrad" x1="0" x2="1"><stop offset="0" stop-color="#129490"/><stop offset="0.45" stop-color="#4D79C7"/><stop offset="0.72" stop-color="#8066C0"/><stop offset="1" stop-color="#5A9C43"/></linearGradient>
    <linearGradient id="titleGrad" x1="0" x2="1"><stop offset="0" stop-color="#129490"/><stop offset="1" stop-color="#7451A6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.10"/></filter>
    <filter id="glowBlue" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="7" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4C5A6C"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7451A6"/></marker>
    <style>
      .font{font-family:Inter,Segoe UI,Arial,sans-serif}
      .title{font-size:64px;font-weight:800;fill:#0A1E44}
      .subtitle{font-size:24px;font-weight:500;fill:#334A68}
      .h{font-size:25px;font-weight:750}
      .body{font-size:17px;font-weight:500;fill:#25364A}
      .small{font-size:15px;font-weight:500;fill:#506176}
      .tiny{font-size:13px;font-weight:500;fill:#65758A}
      .arrow{stroke:#4C5A6C;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}
      .dash{stroke:#7451A6;stroke-width:4;fill:none;stroke-dasharray:10 10;stroke-linecap:round;stroke-linejoin:round}
      .stage{filter:url(#shadow)}
      .pulse{transform-box:fill-box;transform-origin:center}
      .packet{filter:url(#glowBlue)}
      @media (prefers-reduced-motion: reduce){.motion{display:none}.pulse{animation:none}}
    </style>
  </defs>

  <rect width="1600" height="900" fill="#FFFFFF"/>

  <g class="font">
    <circle cx="426" cy="92" r="52" fill="#F7FBFD" stroke="#0A1E44" stroke-width="5"/>
    <path d="M426 124V62M426 78l-22-18M426 88l25-22M426 101l-29 13M426 104l28 16" stroke="#0A1E44" stroke-width="4" fill="none" stroke-linecap="round"/>
    <rect x="391" y="50" rx="7" width="17" height="8" fill="#26B6A8" transform="rotate(-28 399 54)"/>
    <rect x="451" y="51" rx="7" width="18" height="8" fill="#5D8AD4" transform="rotate(30 460 55)"/>
    <ellipse cx="386" cy="97" rx="8" ry="13" fill="#48C7B7" transform="rotate(24 386 97)"/>
    <ellipse cx="468" cy="99" rx="8" ry="13" fill="#8066C0" transform="rotate(18 468 99)"/>
    <text x="500" y="111" class="title">PanPhyloFlow</text>
    <rect x="502" y="133" width="590" height="4" rx="2" fill="url(#titleGrad)"/>
    <circle cx="1092" cy="135" r="6" fill="#7451A6"/>
    <text x="502" y="171" class="subtitle">Watch the analysis move from genomes to an interpretable phylogeny</text>
  </g>

  <g class="font">
    <rect x="44" y="202" width="390" height="108" rx="19" fill="#FAFCFE" stroke="#98A2B3" stroke-width="3" stroke-dasharray="9 8"/>
    <text x="70" y="234" class="small">Optional upstream companion</text>
    <text x="70" y="270" class="h" fill="#129490">PanGenFlow</text>
    <text x="195" y="270" class="small">download • deduplicate • ANI • QC</text>
    <path d="M238 310v58" class="arrow" stroke-dasharray="9 8" marker-end="url(#arrow)"/>
  </g>

  <path d="M180 521H1460" stroke="#D8E0EA" stroke-width="6" fill="none" stroke-linecap="round"/>
  <path d="M180 521H1460" stroke="url(#flowGrad)" stroke-width="3" fill="none" stroke-linecap="round" stroke-dasharray="10 15" opacity="0.8">
    <animate attributeName="stroke-dashoffset" values="0;-50" dur="2s" repeatCount="indefinite"/>
  </path>

  <g class="font stage pulse">
    <rect x="54" y="390" width="190" height="270" rx="22" fill="#F2FBFA" stroke="#129490" stroke-width="3">
      <animate attributeName="stroke-width" values="3;7;3" dur="8.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <path d="M105 432h52l26 26v61h-78zM157 432v28h26" fill="none" stroke="#129490" stroke-width="4" stroke-linejoin="round"/>
    <path d="M126 472c14-17 28 17 42 0M126 491c14 17 28-17 42 0" fill="none" stroke="#129490" stroke-width="3" stroke-linecap="round"/>
    <text x="149" y="554" text-anchor="middle" class="h" fill="#0E7F7A">Input</text>
    <text x="149" y="586" text-anchor="middle" class="body">FASTA / GFF3</text>
    <text x="149" y="616" text-anchor="middle" class="small">analysis-ready genomes</text>
  </g>

  <g class="font stage pulse">
    <rect x="272" y="390" width="190" height="270" rx="22" fill="#F4F8FF" stroke="#4D79C7" stroke-width="3">
      <animate attributeName="stroke-width" values="3;3;7;3;3" keyTimes="0;0.12;0.18;0.30;1" dur="8.4s" begin="0s" repeatCount="indefinite"/>
    </rect>
    <path d="M325 432h49l26 26v63h-75zM374 432v28h26M340 476h44M340 496h44" fill="none" stroke="#4D79C7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="367" y="554" text-anchor="middle" class="h" fill="#376BB7">Annotation</text>
    <text x="367" y="586" text-anchor="middle" class="body">Prokka for FASTA</text>
    <text x="367" y="616" text-anchor="middle" class="small">GFF3 passes through</text>
  </g>

  <g class="font stage pulse">
    <rect x="490" y="370" width="210" height="310" rx="24" fill="#FFF9EC" stroke="#E8A20D" stroke-width="5">
      <animate attributeName="stroke-width" values="5;5;9;5;5" keyTimes="0;0.27;0.34;0.46;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <circle cx="595" cy="452" r="38" fill="none" stroke="#F2A900" stroke-width="11" stroke-dasharray="12 7">
      <animateTransform attributeName="transform" type="rotate" from="0 595 452" to="360 595 452" dur="5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="640" cy="481" r="19" fill="none" stroke="#F2A900" stroke-width="8" stroke-dasharray="8 5">
      <animateTransform attributeName="transform" type="rotate" from="360 640 481" to="0 640 481" dur="3.6s" repeatCount="indefinite"/>
    </circle>
    <text x="595" y="554" text-anchor="middle" class="h" style="font-size:35px" fill="#C96B08">Roary</text>
    <text x="595" y="588" text-anchor="middle" class="body">default pangenome engine</text>
    <rect x="550" y="615" width="90" height="38" rx="19" fill="#F2A900"/>
    <text x="595" y="640" text-anchor="middle" fill="#FFFFFF" style="font-size:17px;font-weight:750">default</text>
  </g>

  <g class="font stage pulse">
    <rect x="728" y="390" width="220" height="270" rx="22" fill="#F2FBFA" stroke="#129490" stroke-width="3">
      <animate attributeName="stroke-width" values="3;3;7;3;3" keyTimes="0;0.43;0.50;0.62;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M780 500v-22M803 500v-48M826 500v-72M849 500v-98" stroke="#129490" stroke-width="10" stroke-linecap="round"/>
    <path d="M765 510h100" fill="none" stroke="#129490" stroke-width="3"/>
    <text x="838" y="554" text-anchor="middle" class="h" fill="#0E7F7A">Summaries</text>
    <text x="838" y="584" text-anchor="middle" class="small">presence/absence • partitions</text>
    <text x="838" y="610" text-anchor="middle" class="small">threshold sensitivity • plots</text>
  </g>

  <g class="font stage pulse">
    <rect x="976" y="390" width="190" height="270" rx="22" fill="#F8F5FD" stroke="#8066C0" stroke-width="3">
      <animate attributeName="stroke-width" values="3;3;7;3;3" keyTimes="0;0.58;0.65;0.77;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <g stroke="#8066C0" stroke-width="6" stroke-linecap="round"><path d="M1011 458h30m18 0h68"/><path d="M1011 483h75m18 0h24"/><path d="M1011 508h23m18 0h76"/></g>
    <text x="1071" y="554" text-anchor="middle" class="h" fill="#6747A0">Core alignment</text>
    <text x="1071" y="586" text-anchor="middle" class="small">conserved loci</text>
    <text x="1071" y="612" text-anchor="middle" class="small">for phylogenetic inference</text>
  </g>

  <g class="font stage pulse">
    <rect x="1194" y="390" width="190" height="270" rx="22" fill="#F4F8FF" stroke="#4D79C7" stroke-width="3">
      <animate attributeName="stroke-width" values="3;3;7;3;3" keyTimes="0;0.73;0.80;0.92;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M1237 455h29v-22m0 22v44m0-21h29m0 0v-24m0 24v25m0-25h29" fill="none" stroke="#376BB7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1266" cy="433" r="7" fill="#376BB7"/><circle cx="1295" cy="454" r="7" fill="#376BB7"/><circle cx="1295" cy="503" r="7" fill="#376BB7"/><circle cx="1325" cy="478" r="7" fill="#376BB7"/>
    <text x="1289" y="554" text-anchor="middle" class="h" fill="#376BB7">IQ-TREE 3</text>
    <text x="1289" y="585" text-anchor="middle" class="body">model + support</text>
    <text x="1289" y="612" text-anchor="middle" class="small">core-genome phylogeny</text>
  </g>

  <g class="font stage pulse">
    <rect x="1412" y="390" width="140" height="270" rx="22" fill="#F5FBF3" stroke="#5A9C43" stroke-width="3">
      <animate attributeName="stroke-width" values="3;3;7;3" keyTimes="0;0.88;0.97;1" dur="8.4s" repeatCount="indefinite"/>
    </rect>
    <path d="M1446 437h47l22 22v63h-69zM1493 437v24h22M1461 487h38M1461 505h27" fill="none" stroke="#5A9C43" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1482" y="554" text-anchor="middle" class="h" fill="#4B8E36" style="font-size:22px">Outputs</text>
    <text x="1482" y="584" text-anchor="middle" class="tiny">HTML report</text>
    <text x="1482" y="606" text-anchor="middle" class="tiny">tables • figures</text>
    <text x="1482" y="628" text-anchor="middle" class="tiny">Newick tree</text>
  </g>

  <g class="motion">
    <circle class="packet" r="9" fill="#FFFFFF" stroke="#129490" stroke-width="5">
      <animateMotion dur="8.4s" repeatCount="indefinite" path="M180 521 H1460"/>
    </circle>
    <circle class="packet" r="7" fill="#FFFFFF" stroke="#4D79C7" stroke-width="4" opacity="0.95">
      <animateMotion dur="8.4s" begin="-2.8s" repeatCount="indefinite" path="M180 521 H1460"/>
    </circle>
    <circle class="packet" r="7" fill="#FFFFFF" stroke="#8066C0" stroke-width="4" opacity="0.95">
      <animateMotion dur="8.4s" begin="-5.6s" repeatCount="indefinite" path="M180 521 H1460"/>
    </circle>
  </g>

  <g class="font">
    <rect x="520" y="730" width="235" height="94" rx="18" fill="#F8F5FD" stroke="#8066C0" stroke-width="3"/>
    <text x="552" y="769" class="h" fill="#6747A0">Panaroo</text>
    <text x="552" y="798" class="small">optional alternative engine</text>
    <path d="M595 680v50" class="dash" marker-end="url(#arrowPurple)"/>
    <path d="M755 777h83c28 0 50-22 50-50v-67" class="dash" marker-end="url(#arrowPurple)"/>
    <circle r="6" fill="#8066C0" class="motion">
      <animateMotion dur="5s" repeatCount="indefinite" path="M595 680 V730 M755 777 H838 Q888 777 888 727 V660"/>
    </circle>

    <rect x="1010" y="738" width="500" height="86" rx="18" fill="#FBFCFE" stroke="#CDD5DF" stroke-width="2"/>
    <circle cx="1048" cy="781" r="20" fill="#F4F8FF" stroke="#0A1E44" stroke-width="3"/>
    <text x="1048" y="789" text-anchor="middle" style="font-size:23px;font-weight:800;fill:#0A1E44">i</text>
    <text x="1082" y="773" class="small">Moving particles represent genomes and intermediate analysis products.</text>
    <text x="1082" y="800" class="small">PanGenFlow is optional; PanPhyloFlow begins with analysis-ready genomes.</text>
  </g>
</svg>
