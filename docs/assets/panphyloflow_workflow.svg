<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">PanPhyloFlow workflow</title>
  <desc id="desc">Roary-first microbial pangenomics and phylogenomics workflow with optional PanGenFlow genome preparation and Panaroo alternative route.</desc>
  <defs>
    <linearGradient id="titleLine" x1="0" x2="1"><stop offset="0" stop-color="#129490"/><stop offset="1" stop-color="#7451A6"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#0B1F3A" flood-opacity="0.10"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="9" stdDeviation="14" flood-color="#F2A900" flood-opacity="0.22"/></filter>
    <style>.font{font-family:Inter,Segoe UI,Arial,sans-serif}.title{font-size:72px;font-weight:800;fill:#0A1E44}.subtitle{font-size:25px;font-weight:500;fill:#334A68}.h{font-size:26px;font-weight:750}.body{font-size:17px;font-weight:500;fill:#25364A}.small{font-size:15px;font-weight:500;fill:#506176}.tiny{font-size:14px;font-weight:500;fill:#65758A}.arrow{stroke:#4C5A6C;stroke-width:4;fill:none;stroke-linecap:round;stroke-linejoin:round}.dash{stroke:#7451A6;stroke-width:4;fill:none;stroke-dasharray:10 10;stroke-linecap:round;stroke-linejoin:round}.optional{stroke:#98A2B3;stroke-width:3;fill:#FAFCFE;stroke-dasharray:9 8}.icon{fill:none;stroke-width:4;stroke-linecap:round;stroke-linejoin:round}</style>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#4C5A6C"/></marker>
    <marker id="arrowPurple" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0,0 L12,6 L0,12 z" fill="#7451A6"/></marker>
  </defs>
  <rect width="1600" height="900" fill="#FFFFFF"/>
  <g class="font"><circle cx="450" cy="84" r="56" fill="#F7FBFD" stroke="#0A1E44" stroke-width="5"/><path d="M450 118V58M450 76l-22-18M450 86l24-22M450 98l-29 13M450 102l27 15" stroke="#0A1E44" stroke-width="4" fill="none" stroke-linecap="round"/><rect x="415" y="47" rx="7" width="17" height="8" fill="#26B6A8" transform="rotate(-28 423 51)"/><rect x="474" y="48" rx="7" width="18" height="8" fill="#5D8AD4" transform="rotate(30 483 52)"/><ellipse cx="410" cy="90" rx="8" ry="13" fill="#48C7B7" transform="rotate(24 410 90)"/><ellipse cx="491" cy="94" rx="8" ry="13" fill="#8066C0" transform="rotate(18 491 94)"/><text x="528" y="103" class="title">PanPhyloFlow</text><rect x="530" y="124" width="600" height="4" rx="2" fill="url(#titleLine)"/><circle cx="1130" cy="126" r="6" fill="#7451A6"/><text x="530" y="164" class="subtitle">Reproducible microbial pangenomics and phylogenomics workflow</text></g>
  <g class="font"><rect x="34" y="175" width="410" height="120" rx="20" class="optional"/><path d="M80 243c-15 0-25-9-25-22 0-12 9-22 21-22 4-15 16-24 31-24 19 0 33 14 34 32 13 0 23 8 23 20 0 10-8 16-18 16H80z" fill="none" stroke="#129490" stroke-width="4"/><path d="M106 216v39m0 0-12-12m12 12 12-12" stroke="#129490" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round"/><text x="190" y="205" class="small">Optional upstream companion</text><text x="190" y="240" class="h" fill="#129490">PanGenFlow</text><text x="190" y="268" class="small">Download genomes • Deduplicate • ANI • QC</text><path d="M175 295v35c0 16-14 28-30 28h-28v25" class="arrow" stroke-dasharray="9 8" marker-end="url(#arrow)"/></g>
  <g class="font" filter="url(#shadow)"><rect x="32" y="385" width="205" height="292" rx="22" fill="#F2FBFA" stroke="#129490" stroke-width="3"/><path d="M92 425h56l28 28v68H92zM148 425v30h28" class="icon" stroke="#129490"/><path d="M116 466c15-18 30 18 45 0M116 486c15 18 30-18 45 0" class="icon" stroke="#129490" stroke-width="3"/><text x="134" y="551" text-anchor="middle" class="h" fill="#0E7F7A">Input genomes</text><text x="134" y="586" text-anchor="middle" class="body">Analysis-ready</text><text x="134" y="611" text-anchor="middle" class="body">microbial genomes</text><text x="134" y="644" text-anchor="middle" class="small">FASTA or compatible GFF3</text>
    <rect x="275" y="385" width="205" height="292" rx="22" fill="#F4F8FF" stroke="#4D79C7" stroke-width="3"/><path d="M338 426h55l28 28v69h-83zM393 426v29h28M355 474h47M355 493h47" class="icon" stroke="#4D79C7"/><text x="378" y="551" text-anchor="middle" class="h" fill="#376BB7">Annotation</text><text x="378" y="594" text-anchor="middle" class="body">FASTA → Prokka</text><text x="378" y="625" text-anchor="middle" class="body">GFF3 passes through</text>
    <rect x="518" y="365" width="220" height="332" rx="24" fill="#FFF9EC" stroke="#E8A20D" stroke-width="5" filter="url(#glow)"/><circle cx="628" cy="444" r="39" fill="none" stroke="#F2A900" stroke-width="11" stroke-dasharray="12 7"/><circle cx="675" cy="473" r="20" fill="none" stroke="#F2A900" stroke-width="8" stroke-dasharray="8 5"/><text x="628" y="552" text-anchor="middle" class="h" style="font-size:36px" fill="#C96B08">Roary</text><text x="628" y="590" text-anchor="middle" class="body">Default pangenome engine</text><rect x="584" y="623" width="88" height="38" rx="19" fill="#F2A900"/><text x="628" y="648" text-anchor="middle" fill="#FFFFFF" style="font-size:17px;font-weight:750">default</text>
    <rect x="780" y="385" width="235" height="292" rx="22" fill="#F2FBFA" stroke="#129490" stroke-width="3"/><path d="M850 482v-20M871 482v-45M892 482v-70M913 482v-96" stroke="#129490" stroke-width="10" stroke-linecap="round"/><path d="M835 493h95" class="icon" stroke="#129490" stroke-width="3"/><text x="897" y="536" text-anchor="middle" class="h" fill="#0E7F7A" style="font-size:22px">Pangenome summaries</text><text x="897" y="568" text-anchor="middle" class="small">Gene presence/absence</text><text x="897" y="594" text-anchor="middle" class="small">Core vs accessory statistics</text><text x="897" y="620" text-anchor="middle" class="small">Gene-frequency spectrum</text><text x="897" y="646" text-anchor="middle" class="small">Core-threshold sensitivity</text>
    <rect x="1055" y="385" width="190" height="292" rx="22" fill="#F8F5FD" stroke="#8066C0" stroke-width="3"/><g stroke="#8066C0" stroke-width="6" stroke-linecap="round"><path d="M1094 450h30m18 0h48"/><path d="M1094 474h68m17 0h18"/><path d="M1094 498h20m17 0h66"/></g><text x="1150" y="548" text-anchor="middle" class="h" fill="#6747A0">Core alignment</text><text x="1150" y="591" text-anchor="middle" class="small">Engine-generated</text><text x="1150" y="616" text-anchor="middle" class="small">core alignment</text><text x="1150" y="646" text-anchor="middle" class="tiny">Panaroo filtered alignment</text><text x="1150" y="665" text-anchor="middle" class="tiny">preferred when available</text>
    <rect x="1285" y="385" width="190" height="292" rx="22" fill="#F4F8FF" stroke="#4D79C7" stroke-width="3"/><path d="M1332 452h28v-22m0 22v42m0-20h28m0 0v-23m0 23v23m0-23h29" class="icon" stroke="#376BB7"/><circle cx="1360" cy="430" r="7" fill="#376BB7"/><circle cx="1388" cy="451" r="7" fill="#376BB7"/><circle cx="1388" cy="497" r="7" fill="#376BB7"/><circle cx="1418" cy="474" r="7" fill="#376BB7"/><text x="1380" y="548" text-anchor="middle" class="h" fill="#376BB7">IQ-TREE 3</text><text x="1380" y="578" text-anchor="middle" class="h" fill="#376BB7" style="font-size:19px">phylogeny</text><text x="1380" y="616" text-anchor="middle" class="body">ModelFinder</text><text x="1380" y="642" text-anchor="middle" class="body">UFBoot • SH-aLRT</text></g>
  <g class="font"><rect x="1478" y="385" width="110" height="292" rx="22" fill="#F5FBF3" stroke="#5A9C43" stroke-width="3" filter="url(#shadow)"/><path d="M1502 426h48l22 22v67h-70zM1550 426v24h22M1517 480h38M1517 499h25" class="icon" stroke="#5A9C43"/><text x="1533" y="548" text-anchor="middle" class="h" fill="#4B8E36" style="font-size:22px">Outputs</text><text x="1533" y="585" text-anchor="middle" class="tiny">HTML report</text><text x="1533" y="609" text-anchor="middle" class="tiny">TSV tables</text><text x="1533" y="633" text-anchor="middle" class="tiny">Figures</text><text x="1533" y="657" text-anchor="middle" class="tiny">Newick tree</text></g>
  <path d="M237 531h38" class="arrow" marker-end="url(#arrow)"/><path d="M480 531h38" class="arrow" marker-end="url(#arrow)"/><path d="M738 531h42" class="arrow" marker-end="url(#arrow)"/><path d="M1015 531h40" class="arrow" marker-end="url(#arrow)"/><path d="M1245 531h40" class="arrow" marker-end="url(#arrow)"/><path d="M1475 531h12" class="arrow" marker-end="url(#arrow)"/>
  <g class="font"><rect x="560" y="740" width="215" height="92" rx="18" fill="#F8F5FD" stroke="#8066C0" stroke-width="3"/><path d="M594 796a25 25 0 1 1 44 0M616 785l15-15" class="icon" stroke="#8066C0"/><text x="674" y="782" class="h" fill="#6747A0">Panaroo</text><text x="674" y="809" class="small">Alternative engine</text><path d="M628 697v24c0 14 11 19 24 19" class="dash" marker-end="url(#arrowPurple)"/><path d="M775 786h80c24 0 42-18 42-42v-67" class="dash" marker-end="url(#arrowPurple)"/></g>
  <g class="font"><rect x="1020" y="748" width="510" height="92" rx="18" fill="#FBFCFE" stroke="#CDD5DF" stroke-width="2"/><circle cx="1060" cy="794" r="21" fill="#F4F8FF" stroke="#0A1E44" stroke-width="3"/><text x="1060" y="802" text-anchor="middle" style="font-size:24px;font-weight:800;fill:#0A1E44">i</text><text x="1100" y="783" class="small">PanGenFlow is optional.</text><text x="1100" y="810" class="small">PanPhyloFlow starts from analysis-ready genomes.</text></g>
</svg>
